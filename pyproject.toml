[tool.ruff]
extend-exclude = ["docs"]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
	"ANN",  # flake8-annotations
	"ARG",  # flake8-unused-arguments
	"B",    # flake8-bugbear
	"C4",   # flake8-comprehensions
	"C90",  # mccabe
	"D",    # pydocstyle
	"E4",   # pycodestyle imports
	"E7",   # pycodestyle statements
	"E9",   # pycodestyle runtime errors
	"F",    # Pyflakes
	"I",    # isort
	"N",    # pep8-naming
	"PERF", # Perflint
	"PIE",  # flake8-pie
	"PL",   # Pylint
	"PTH",  # flake8-use-pathlib
	"RET",  # flake8-return
	"RUF",  # Ruff-specific rules
	"SIM",  # flake8-simplify
	"UP",   # pyupgrade
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["crapssim", "crapssim.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["."]
testpaths = ["tests"]